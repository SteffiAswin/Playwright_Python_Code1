name: Playwright Python Tests (Manual Trigger by File)

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: "Enter test file or folder to run (e.g., PWA_Test1/test_login.py or PWA_Test1/)"
        required: true
        default: "PWA_Test1/test_login.py"

jobs:
  test:
    runs-on: windows-latest
    name: Run Selected Playwright Tests

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html playwright
          playwright install chromium

      # 4️⃣ Verify connectivity to your PWA (debugging network issues)
      - name: Verify network access to PWA
        run: |
          echo "Testing connectivity to https://pwa.skordev.com ..."
          powershell -Command "(Invoke-WebRequest -Uri https://pwa.skordev.com).StatusCode" || exit 1

      # 5️⃣ Show folder structure for path validation
      - name: Show project structure
        run: |
          Write-Host "Current directory: $PWD"
          Get-ChildItem -Recurse | Select-Object FullName

      # 6️⃣ Run Playwright tests (Headless mode for CI stability)
      - name: Run Playwright tests
        env:
          HEADLESS: "True"
          PYTHONUNBUFFERED: "1"
        run: |
          Write-Host "Running tests from path: ${{ github.event.inputs.test_path }}"
          $env:PYTHONPATH = (Get-Location).Path
          pytest ${{ github.event.inputs.test_path }} `
            --maxfail=1 `
            --disable-warnings `
            -v `
            --html=report.html

      # 7️⃣ Always upload the HTML report
      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-Test-Report
          path: report.html
          if-no-files-found: warn

      # 8️⃣ Always upload recorded videos and screenshots
      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-Artifacts
          path: |
            videos/
            screenshots/
          if-no-files-found: warn
