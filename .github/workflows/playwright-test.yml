name: Playwright Python Tests (Manual Trigger by File)

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: "Enter test file or folder to run (e.g., api_tests/test_api.py or api_tests/)"
        required: true
        default: "PWA_Test/"

jobs:
  test:
    runs-on: windows-latest
    name: Run Selected Playwright Tests

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-html playwright
          playwright install chromium

      # 4️⃣ Show structure (debug)
      - name: Show project structure
        run: |
          Write-Host "Current directory: $PWD"
          Get-ChildItem -Recurse | Select-Object FullName

      # 5️⃣ Run Playwright tests
      - name: Run tests (Headed Mode)
        env:
          HEADLESS: "False"
        run: |
          Write-Host "Running tests from path: ${{ github.event.inputs.test_path }}"
          $env:PYTHONPATH = (Get-Location).Path
          pytest ${{ github.event.inputs.test_path }} `
            --maxfail=1 `
            --disable-warnings `
            -v `
            --html=report.html

      # 6️⃣ Always upload the HTML report
      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-Test-Report
          path: report.html
          if-no-files-found: warn

      # 7️⃣ Always upload recorded videos, screenshots, and traces
      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            videos/
            screenshots/
            trace/
          if-no-files-found: warn
